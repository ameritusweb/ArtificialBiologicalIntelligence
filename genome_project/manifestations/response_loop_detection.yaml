receptor_id: response_loop_detection
family: perception
tier: canopy
stage: 12

conceptual_space: |
  Detects that the organism's own corrective response to a problem IS
  producing or maintaining the problem — a self-caused feedback loop
  in its own processing. The organism's anxiety about a threat causes
  hypervigilance, which causes false alarms, which causes more anxiety,
  which causes more hypervigilance. The corrective action (vigilance
  against threat) IS the cause of the distress it tries to correct.
  The boundary separates detecting external feedback loops (which the
  organism already does) from detecting that IT ITSELF is a node in
  the loop — that its own response is the input that sustains the
  problem. The critical signal is self-as-cause recognition in a
  circular causal chain.

manifestations:
  - id: anxiety_hypervigilance_loop
    description: |
      The organism experiences mild threat signals. It increases
      vigilance (appropriate response). The heightened vigilance
      causes it to detect more ambiguous signals as threats
      (false positives). The increased threat detections elevate
      anxiety further, which increases vigilance further, creating
      an escalating spiral. The organism detects: "My response to
      the threat (vigilance) is generating the threat signals
      (false positives) that sustain my anxiety. I am alarming
      myself."
    survival_relevance: |
      Undetected anxiety loops waste energy, prevent rest, and
      eventually exhaust the organism. Detecting the loop enables
      breaking it — the organism can recognize that its elevated
      threat detections are products of its own hypervigilance
      rather than genuine environmental dangers, and deliberately
      dampen the vigilance response.
    what_fires: |
      The organism detecting that its own response variable
      (vigilance level) is causally connected back to its input
      variable (threat detection) through its own processing —
      forming a self-sustaining cycle. The self-as-loop-node
      detection fires when the organism models itself as both
      the responder and the cause.

  - id: avoidance_reinforcement_loop
    description: |
      The organism avoids a location associated with a past
      threat. The avoidance prevents it from learning that the
      threat is no longer present. Because it never visits the
      location, the threat belief is never updated. The avoidance
      (a response to fear) preserves the fear (by preventing
      disconfirming evidence). The organism detects: "My avoidance
      is what keeps me afraid — by never checking, I never learn
      it is safe."
    survival_relevance: |
      Avoidance-maintained fear can permanently restrict the
      organism's territory and resource access. Detecting the
      loop enables strategic exposure — deliberately visiting
      the avoided location to gather updating information. Without
      loop detection, the organism treats its persistent fear as
      evidence the threat persists.
    what_fires: |
      The organism detecting that its coping strategy (avoidance)
      is preventing the information update (exposure to current
      conditions) that would resolve the problem (fear of the
      location). The response blocks the solution. The self-
      blocking-own-solution detection fires.

  - id: overcompensation_oscillation
    description: |
      The organism detects it is foraging too aggressively
      (depleting patches). It overcompensates by foraging too
      conservatively (leaving too much). It then detects
      underperformance and overcompensates back to aggressive
      foraging. Each correction overshoots, creating an
      oscillation. The organism detects: "My corrections are
      too large, and each overcorrection triggers the next. The
      instability IS my correction pattern, not the environment."
    survival_relevance: |
      Oscillating behavior is energetically wasteful and prevents
      settling into an efficient strategy. Detecting the
      overcorrection pattern enables the organism to dampen its
      corrections — making smaller adjustments that converge on
      the target rather than overshooting repeatedly.
    what_fires: |
      The organism detecting a temporal pattern in its own
      behavioral adjustments — correction, overcorrection, counter-
      correction — and recognizing that the pattern is generated by
      its own correction magnitude rather than by environmental
      changes. The self-generated-oscillation detection fires.

  - id: social_withdrawal_isolation_loop
    description: |
      The organism experiences social stress and withdraws from
      group interaction (coping response). The withdrawal reduces
      social skill practice and positive social contact, making
      future social interactions more stressful. Increased stress
      causes further withdrawal. The organism detects: "My
      withdrawal from social stress is making me worse at social
      interaction, which creates more social stress."
    survival_relevance: |
      Social isolation increases vulnerability to predation and
      reduces access to shared resources and information. Detecting
      the withdrawal-degradation loop enables the organism to
      maintain minimal social contact even during stress, preventing
      the skill degradation that makes re-engagement harder.
    what_fires: |
      The organism detecting that its coping strategy (withdrawal)
      degrades the capacity (social skills) that would resolve the
      original problem (social stress). The response erodes the
      solution. The self-degrading-capability loop fires.

  - id: rumination_attention_capture_loop
    description: |
      The organism experiences a failed hunt. It replays the
      failure (regulatory response to process the event). The
      replay captures attention, preventing focus on current
      opportunities. Missed current opportunities create new
      failures. New failures generate new replays. The organism
      detects: "My processing of past failure is causing present
      failure, which generates more material to process."
    survival_relevance: |
      Rumination that produces new failures creates an ever-growing
      processing backlog. Detecting the loop enables the organism
      to set boundaries on replay — deliberate time-limited
      processing rather than open-ended rumination that captures
      ongoing behavior.
    what_fires: |
      The organism detecting that its processing activity (replay/
      rumination) is consuming the attentional resources needed for
      current performance, causing the very failures it will then
      need to process. The self-feeding processing loop fires.

anti_manifestations:
  - id: detecting_external_feedback_loop
    description: |
      The organism detects a feedback loop in the environment —
      overgrazing a patch reduces plant growth, which reduces food
      availability, which increases grazing pressure on remaining
      plants. The organism models the loop correctly but does not
      model ITSELF as a node — it sees the ecological loop without
      recognizing its own behavior as the driving input.
    why_should_not_fire: |
      This is external feedback loop detection, not response loop
      detection. The organism models environmental dynamics
      correctly but does not identify its own behavior as a causal
      node in the loop. Response loop detection requires the
      organism to see ITSELF as the source of the input that
      sustains the problem — self-as-cause, not environment-as-
      system.
    distinguishes: |
      External loop modeling (seeing loops in the environment)
      versus self-referential loop modeling (seeing oneself as a
      node in a loop one's own responses sustain). The self-as-
      cause-in-the-loop recognition is the boundary.

  - id: appropriate_corrective_response
    description: |
      The organism detects a threat and increases vigilance. The
      increased vigilance detects the threat more precisely,
      enabling an effective response. The vigilance resolves the
      threat and then returns to baseline. The response serves its
      function and terminates — no loop forms because the response
      achieves its goal and stops.
    why_should_not_fire: |
      This is a functional corrective response that achieves its
      purpose and terminates. No self-sustaining loop forms because
      the response resolves the problem rather than perpetuating it.
      Response loop detection requires the response to sustain or
      amplify the problem rather than resolve it — the defining
      feature is that the correction IS the cause.
    distinguishes: |
      Self-terminating correction (response resolves problem and
      stops) versus self-sustaining correction (response perpetuates
      problem and continues). Whether the response resolves or
      perpetuates the triggering condition is the boundary.
