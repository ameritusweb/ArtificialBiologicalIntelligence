receptor_id: empathy
family: social
tier: branch
stage: 4

conceptual_space: |
  Another agent's distress fires the organism's own stress receptors.
  NPC in pain causes the organism's stress to rise, not because the
  organism is threatened, but because it is resonating with the other's
  state. The concept is RESONANCE with another agent's internal state,
  not just detection of the state. The boundary separates empathy from
  observation: detecting "NPC is stressed" is observation; FEELING
  stress because NPC is stressed is empathy.

manifestations:
  - id: distress_resonance
    description: |
      NPC-A takes damage and emits distress signals. The organism is
      in a safe location with no personal threat. The organism's own
      stress level rises in response to observing NPC-A's distress,
      despite having no direct reason for stress.
    survival_relevance: |
      Resonating with another's distress activates protective or
      avoidance behaviors preemptively. If NPC-A is hurt, the source
      of harm may threaten the organism next. Empathic stress is an
      early warning system.
    what_fires: |
      Other agent's observable distress signals (damage emissions,
      erratic movement) cause organism's own stress receptors to
      activate without direct threat to organism. Cross-agent
      state resonance fires.

  - id: frustration_mirroring
    description: |
      NPC-B repeatedly attempts to reach food behind a barrier and
      fails. The organism observes this and its own arousal increases
      — it becomes agitated watching NPC-B's futile attempts, even
      though the organism itself is not trying to reach that food.
    survival_relevance: |
      Mirroring frustration at blocked goals signals environmental
      constraints. If NPC-B can't reach the food, the organism may
      face the same barrier.
    what_fires: |
      Observation of another agent's repeated failure state causes
      organism's own arousal/stress to rise. No personal goal
      frustration exists — the arousal is generated by observing
      the other's state.

  - id: calm_contagion
    description: |
      NPC-C enters a safe zone and visibly relaxes — its movement
      slows, emissions normalize, and it stops scanning. The organism,
      which was mildly aroused, feels its own stress decrease after
      observing NPC-C's calm state.
    survival_relevance: |
      Calm contagion provides environmental safety information. If a
      nearby agent is relaxed, the environment is likely safe. Stress
      reduction preserves metabolic resources.
    what_fires: |
      Other agent's observable calm signals cause organism's own
      stress to decrease. State resonance operates bidirectionally:
      distress raises stress, calm lowers it.

  - id: pain_observation_withdrawal
    description: |
      NPC-D contacts a hazard and recoils. The organism observes the
      recoil and flinches — its own motor system partially activates
      a withdrawal response even though the organism is not in
      contact with the hazard.
    survival_relevance: |
      Motor resonance with observed pain enables vicarious learning.
      The organism learns "that thing hurts" without personally
      experiencing the damage.
    what_fires: |
      Observation of another agent's pain-withdrawal activates
      organism's own withdrawal-related signals. Motor resonance
      plus stress elevation without personal contact fires empathy.

  - id: exhaustion_sympathy
    description: |
      NPC-E has been moving continuously and its speed has progressively
      decreased, indicating exhaustion. The organism observes this and
      its own energy-conservation signals activate — it begins to slow
      down sympathetically despite having adequate energy reserves.
    survival_relevance: |
      Sympathetic exhaustion may coordinate group pacing. It also
      signals that the environment is demanding enough to exhaust
      agents, prompting the organism to conserve resources.
    what_fires: |
      Observation of another agent's progressive depletion signals
      causes organism's own energy-management systems to shift toward
      conservation mode without direct energy deficit. State
      resonance fires across energy domain.

anti_manifestations:
  - id: threat_detection_not_resonance
    description: |
      NPC-F is emitting distress signals near the organism. The
      organism's stress rises — but because NPC-F's distress indicates
      a nearby threat that may affect the organism directly, not
      because of resonance with NPC-F's state.
    why_should_not_fire: |
      The organism's stress is caused by self-relevant threat
      assessment, not by resonance with the other agent's state.
      The organism would be stressed regardless of whether it could
      observe NPC-F, because the threat itself is nearby.
    distinguishes: |
      Empathy fires when the organism's state changes BECAUSE of
      the other agent's state, not because of shared environmental
      threat. Remove the other agent from the scene: if stress
      remains, it's threat detection; if stress disappears, it's
      empathy.

  - id: observation_without_state_change
    description: |
      The organism detects that NPC-G is stressed — NPC-G's emissions
      are erratic, its movement is jerky. The organism accurately
      classifies NPC-G's state as "distressed" but the organism's
      own stress level does not change. Pure observation.
    why_should_not_fire: |
      Detecting another agent's state without experiencing a
      corresponding state change in oneself is observation, not
      empathy. Empathy requires the organism's own internal state
      to shift in resonance with the observed state.
    distinguishes: |
      Empathy requires STATE CHANGE in the observer that mirrors
      the observed agent's state. Accurate detection of another's
      state without mirrored internal shift is social observation.
